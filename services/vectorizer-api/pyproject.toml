[project]
name = "vectorizer-api"
version = "1.0.1"
description = "Bitmap-to-SVG vectorization backend for the Development-Training workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.4",
    "pillow>=11.1.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.11.0.86",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "svgwrite>=1.4.3",
    "vtracer>=0.6.15",
    "resvg-py>=0.5.0",
    "rembg[cpu]>=2.0.75",
]

[project.scripts]
vectorizer-api = "app.main:run"

[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pyinstaller",
]
